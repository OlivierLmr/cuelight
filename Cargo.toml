[workspace]
members = ["cuelight-suite"]
# Named explicitly, or a bare `cargo test` runs the root package only and the suite crate's
# tests never execute. That silence is how a release once shipped with a red target.
default-members = [".", "cuelight-suite"]

[package]
name = "cuelight"
version = "0.5.0"
edition = "2021"
description = "Deterministic discrete-event simulator for distributed systems: the network, the clock and the faults"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 2
