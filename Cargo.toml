[package]
name = "cuelight"
version = "0.1.0"
edition = "2021"
description = "Deterministic discrete-event simulator for distributed systems: the network, the clock and the faults"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 2
