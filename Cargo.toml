[package]
name = "sdr-harness"
version = "0.1.0"
edition = "2021"
description = "Deterministic discrete-event harness for the SDR distributed systems labs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 2
